x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Only other containers on the compose network need this; keep it off the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -d ${POSTGRES_DB:-app} -U ${POSTGRES_USER:-postgres}",
        ]
      interval: 1m
      timeout: 1s
      retries: 3
      start_period: 30s
      start_interval: 1s

  backend:
    build:
      context: ./backend
    image: slippi-replay-hosting-server-backend
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      REPLAY_VIEW_ARCHIVE_DIR: /app/uploads-view-archive
    ports:
      # httpd proxies /api internally; only expose 8000 for local debugging.
      - "127.0.0.1:8000:8000"
      # Wiis on the LAN connect to these directly, so they must stay open.
      - "${FTP_PORT:-2121}:${FTP_PORT:-2121}"
      - "${FTP_PASSIVE_PORTS:-22100-22199}:${FTP_PASSIVE_PORTS:-22100-22199}"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./uploads-view-archive:/app/uploads-view-archive
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)\"",
        ]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 45s
      start_interval: 1s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    image: slippi-replay-hosting-server-frontend
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    environment:
      FRONTEND_MODE: ${FRONTEND_MODE:-production}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_SLIPPILAB_URL: ${VITE_SLIPPILAB_URL:-http://localhost:${SLIPPILAB_PORT:-4173}}
      VITE_DEV_PROXY_TARGET: ${VITE_DEV_PROXY_TARGET:-http://backend:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,127.0.0.1}
    # httpd proxies to this internally; only expose 5173 for local debugging.
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  httpd:
    image: httpd:2.4-alpine
    depends_on:
      - backend
      - frontend
    logging: *default-logging
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

  slippilab:
    image: node:20-alpine
    working_dir: /app
    logging: *default-logging
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${SLIPPILAB_PORT:-4173}"
    # Not proxied by httpd; only needed for local debugging.
    ports:
      - "127.0.0.1:${SLIPPILAB_PORT:-4173}:${SLIPPILAB_PORT:-4173}"
    volumes:
      - ./slippilab:/app
      - /app/node_modules

volumes:
  pg_data:
